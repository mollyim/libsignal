name: Build

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Free up disk space in runner
      uses: ./.github/actions/disk-cleanup

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        builder: default
        context: .
        file: Dockerfile.android
        load: true
        tags: libsignal-builder
        cache-from: type=gha,scope=libsignal-builder
        cache-to: type=gha,scope=libsignal-builder,mode=max

    - name: Assemble and test inside Docker
      run: |
        docker run --name builder-run \
          -v "$HOME/.gradle/caches:/.gradle-ro-cache:ro" \
          libsignal-builder assemble test

    - name: Commit the builder run
      run: docker commit builder-run localhost/libsignal-snapshot

    - name: Build the artifacts image
      uses: docker/build-push-action@v7
      with:
        builder: default
        context: .
        file: Dockerfile.android
        target: artifacts
        build-contexts: assemble=docker-image://localhost/libsignal-snapshot
        outputs: type=local,dest=artifacts
        provenance: false

    - name: List artifact checksums
      working-directory: artifacts
      run: |
        find . -type f -printf '%P\0' | sort -z | xargs -0 -r sha256sum -b --

    - name: Archive release artifacts
      uses: actions/upload-artifact@v7
      with:
        name: libsignal-artifacts
        path: artifacts
        if-no-files-found: error
