plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm'
}

base {
    archivesName = "libsignal-server"
}

repositories {
    mavenCentral()
    mavenLocal()
}

sourceSets {
    main {
        java {
            // Include libsignal sources shared between the client and server
            srcDir '../shared/java'
        }
        kotlin {
            srcDir 'src/main/java'
            // Include libsignal sources shared between the client and server
            srcDir '../shared/java'
        }
        resources {
            srcDir '../shared/resources'
        }
    }
    test {
        java {
            srcDir '../shared/test/java'
        }
        kotlin {
            srcDir 'src/test/java'
            srcDir '../shared/test/java'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:2.1.0'
}

test {
    jvmArgs '-Xcheck:jni'
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
    withJavadocJar()
}

sourcesJar {
    // Cut down on artifact size by leaving these out of the sources jar.
    exclude '*.dll'
    exclude '*.dylib'
    exclude '*.so'
}

tasks.named('javadoc') {
    // Standard javadoc reads only Java sources; put the compiled Kotlin
    // classes on the classpath so references to them still resolve.
    classpath += sourceSets.main.output
    failOnError = false
}

processResources {
    dependsOn ':makeJniLibrariesServer'
}

afterEvaluate {
    tasks.withType(Exec).configureEach { task ->
        task.doFirst {
            logger.lifecycle("[Exec] Running command: ${task.commandLine.join(' ')}")
        }
    }
}

// MARK: Publishing

publishing {
    publications {
        server(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java

            pom {
                name = base.archivesName.get()
                description = 'Signal Protocol cryptography library for Java (server-side)'
                url = 'https://github.com/mollyim/libsignal'

                scm {
                    url = 'https://github.com/mollyim/libsignal/'
                    connection = 'scm:git:https://github.com/mollyim/libsignal.git'
                    developerConnection = 'scm:git:ssh://git@github.com:mollyim/libsignal.git'
                }

                licenses {
                    license {
                        name = 'AGPL-3.0-only'
                        url = 'https://www.gnu.org/licenses/agpl-3.0.txt'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        organizationUrl = 'https://molly.im'
                    }
                }

                organization {
                    url = 'https://molly.im'
                }
            }
        }
    }
}
